name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # タグ付きpush時にReleaseへAPKを添付するため

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ボタン付け替えロジックの単体テスト(ホストのgccで実行)
      - name: Test native logic
        run: |
          set -o pipefail
          {
            gcc -std=gnu11 -Wall -Wextra -o "$RUNNER_TEMP/test_remap" native/test_remap.c
            "$RUNNER_TEMP/test_remap"
          } 2>&1 | tee "$RUNNER_TEMP/1-test.log"

      # ネイティブのデーモンをNDKでビルド(assets/ に出力される)
      - name: Build native daemon
        run: |
          set -o pipefail
          bash scripts/build-native.sh 2>&1 | tee "$RUNNER_TEMP/2-native.log"

      # Gradle本体をここで導入するので gradlew / wrapper.jar がなくてもビルドできる
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true   # 依存関係の古いキャッシュ(「見つからない」の記録)を引き継がない

      # 参考情報: ランナーから各リポジトリへ届くかを表示する(失敗してもビルドは続ける)
      - name: Check repository access
        continue-on-error: true
        run: |
          for u in \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.23/kotlin-stdlib-1.9.23.pom \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.7.3/gradle-8.7.3.pom \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/kotlin-gradle-plugin/2.0.21/kotlin-gradle-plugin-2.0.21.pom
          do
            curl -s -o /dev/null -m 20 -w "HTTP %{http_code}  $u\n" "$u" || echo "curl failed  $u"
          done

      # 任意: SecretsにKEYSTORE_BASE64があれば固定鍵で署名(更新インストール可能になる)
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_PATH" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          LOG="$RUNNER_TEMP/3-gradle.log"
          for attempt in 1 2 3; do
            echo "=== Gradle attempt $attempt ==="
            if gradle "$TASK" --no-daemon --console=plain --refresh-dependencies \
                 -PversionCode=${{ github.run_number }} 2>&1 | tee "$LOG"; then
              exit 0
            fi
            # 依存関係のダウンロード失敗・通信エラー(一時的な不調)のときだけやり直す
            if ! grep -qE 'Could not (resolve|find|GET|HEAD)|Connection (reset|timed out)|Read timed out|Remote host terminated' "$LOG"; then
              exit 1
            fi
            echo "ダウンロードに失敗したので20秒後にやり直します"
            sleep 20
          done
          exit 1

      # 失敗したときだけ、ログからエラー行を抜き出して注釈(Annotations)に出す
      - name: Show build errors
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/1-test.log "$RUNNER_TEMP"/2-native.log "$RUNNER_TEMP"/3-gradle.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E '^e: |error:|Error:|FAILED|What went wrong|Unresolved reference|Manifest merger|AAPT|aidl|Assertion|Caused by' -A2 "$f" | head -60 || true)
            [ -n "$msg" ] || continue
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=$(basename "$f")::$msg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: MouseRemap-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/*/*.apk
